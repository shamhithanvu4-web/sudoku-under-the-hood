ons you can perform on it and what each operation promises, without saying how the data is stored.",example:"The Sudoku board ADT promises, for example, that getCell(r, c) returns the value at a cell, that setCell refuses to change a starting clue, and that findConflict reports whether a digit breaks a rule. A caller never needs to know there is an array inside.",demo:"adt",demoCaption:"Call the board's public operations on the classroom puzzle. These are live calls on a real SudokuBoard object.",code:{file:"board",signatures:!0},implementation:"src/domain/SudokuBoard.ts declares the ADT as a class. Its public methods (listed here, read straight from the source) are the interface. The UI, the game session and both solvers use only these methods.",quiz:{question:"Which of these belongs to the definition of the board ADT, rather than to one implementation of it?",options:["The cells are stored in a number[][] array","setCell refuses to change a starting clue","reset() copies each row with the spread operator","The grid is kept in a # private field"],answer:1,explanation:"An ADT is defined by its operations and the behaviour they promise. The array, how rows are copied and how the field is hidden are choices made by this particular implementation."}},{id:"adt-vs-ds",title:"Data structures versus ADTs",summary:"The contract versus the storage.",definition:"A data structure is a concrete way of organising data in memory: an array, a linked list, a hash table. An ADT is the contract; a data structure is one way to fulfil it.",example:"The board ADT could sit on a 9\xD79 array (as it does here), on a flat array of 81 numbers, or on bitmasks that record which digits each row, column and box already contains. Each choice changes how operations are computed and how fast they run, but not what they promise.",demo:"representations",demoCaption:"Select a cell and a representation. The values are computed live from the classroom puzzle.",code:{file:"counter",member:"countSolutions"},implementation:"This project already has two representations of a board. SudokuBoard uses a 2D array for clarity. src/domain/solutionCounter.ts, shown here, uses one bitmask per row, column and box to count solutions quickly when checking puzzles.",quiz:{question:"If SudokuBoard switched from a 9\xD79 array to a flat array of 81 numbers, which code would have to change?",options:["Only the inside of the SudokuBoard class","Both solvers","The Play mode user interface","Every module that reads a cell"],answer:0,explanation:"Callers use only the operations, so only the class that implements them changes. That is the practical payoff of keeping the ADT separate from its data structure."}},{id:"encapsulation",title:"Encapsulation",summary:"Hide the data; guard every change.",definition:"Encapsulation bundles data together with the operations that guard it, and hides the data itself, so it can only change in approved ways.",example:"The board's grid is a private field. The only ways to change a cell are setCell (for players; it refuses clues) and placeCandidate / undoPlacement (for the solver; they refuse illegal digits and out-of-order undo).",demo:"encapsulation",demoCaption:"Each button runs the call on a real board and shows exactly what the board answered.",code:{file:"board",member:"placeCandidate"},implementation:"placeCandidate checks the index, the digit, whether the cell is a clue, whether it is empty and whether the digit is legal before it writes anything. A bug in the solver shows up as a clear error instead of a silently corrupted board.",quiz:{question:"The solver calls undoPlacement(2, 5), but its most recent placement was at (4, 1). What happens?",options:["The board clears (2, 5) anyway","The board throws UNDO_ORDER and changes nothing","The board clears (4, 1) instead","The call is silently ignored"],answer:1,explanation:"Undo must happen in last-in, first-out order, the same order the recursion unwinds. The board enforces that rule instead of trusting the caller."}},{id:"arrays-2d",title:"Two-dimensional arrays",summary:"grid[row][col], stored row after row.",definition:"A two-dimensional array is an array whose elements are arrays. grid[r] is a whole row and grid[r][c] is one cell. In memory the rows are usually laid out one after another, which is called row-major order.",example:"The cell in the 4th row and 7th column is grid[3][6], because indices start at 0. Its 3\xD73 box starts at row 3 \u2212 (3 mod 3) = 3 and column 6 \u2212 (6 mod 3) = 6. In a flat list of 81 numbers it would sit at 3 \xD7 9 + 6 = 33.",demo:"indexing",demoCaption:"Click any cell to see its indices, its box and its place in memory.",code:{file:"board",member:"findEmptyCell"},implementation:"findEmptyCell walks the array with two nested loops, row by row and left to right: exactly row-major order. That order decides which cell the plain solver fills next.",quiz:{question:"In row-major order, what is the flat index of grid[5][2]?",options:["47","23","45","29"],answer:0,explanation:"Five full rows of 9 come before it (5 \xD7 9 = 45), then 2 more cells: 45 + 2 = 47."}},{id:"constraints",title:"Sudoku constraints",summary:"27 units, 20 peers per cell.",definition:"A constraint is a rule every valid answer must satisfy. Sudoku has three kinds: no digit may repeat in a row, in a column, or in a 3\xD73 box.",example:"There are 27 units: 9 rows, 9 columns and 9 boxes. Every cell belongs to exactly three of them and shares a unit with 20 other cells, called its peers. A digit can go in a cell only if none of its 20 peers already holds it.",demo:"constraints",demoCaption:"Choose a cell and a digit. The check is a live call to board.findConflict().",code:{file:"board",member:"findConflict"},implementation:"findConflict checks the row, then the column, then the box, and returns the first clash it finds together with where it is. The solver's explanations quote that clash.",quiz:{question:"How many positions do findConflict's loops visit at most when checking one digit?",options:["9","20","27","81"],answer:2,explanation:"Nine cells in the row, nine in the column and nine in the box. They overlap, so only 20 distinct peers matter, but the three simple loops visit 27 positions."}},{id:"recursion",title:"Recursion",summary:"Solve a smaller copy of the same problem.",definition:"A recursive function solves a problem by calling itself on a smaller version of the same problem, and stops at a base case that needs no further calls.",example:"solve(board) fills one empty cell, then calls solve on a board with one fewer empty cell. The base case is a board with no empty cells. Each call gets its own frame on the call stack, holding its own cell and its own digit loop.",demo:"recursion",demoCaption:"A nearly finished board with 7 empty cells. Step through the real recorded run and watch the stack grow and unwind.",code:{file:"backtracking",member:"solve",step:"enter"},implementation:"The highlighted line starts a new call: the recorder opens a frame one level deeper than its parent. The base case is the `cell === null` branch.",quiz:{question:"This board has 7 empty cells and the solver never needs to backtrack. How many frames are on the stack at its deepest point?",options:["7","8","9","81"],answer:1,explanation:"Depths 0 to 7: one call per empty cell, plus the final call that finds no empty cell left and hits the base case."}},{id:"backtracking",title:"Backtracking",summary:"Undo the last choice and try the next.",definition:"Backtracking searches through choices: make a choice, continue, and if you reach a dead end, undo the most recent choice and try the next alternative.",example:"When the solver places a digit and the recursive call returns false, it calls undoPlacement() to erase the digit and tries the next one. If all nine digits fail, it returns false, and its caller undoes its own choice. Recursion plus undo is a depth-first search.",demo:"backtracking",demoCaption:"A small board where the first guesses are wrong. Jump between the real backtracking events.",code:{file:"backtracking",member:"solve",step:"undo"},implementation:"The highlighted lines run only after the recursive call has returned false. undoPlacement restores the cell to 0 so the board is exactly as it was before this choice.",quiz:{question:"Why must the solver erase a digit when its branch fails?",options:["To free memory","So the board is exactly as it was before that choice when the loop tries the next digit","Because findEmptyCell cannot see filled cells","It does not need to; the next digit simply overwrites it"],answer:1,explanation:"Every call relies on the board matching the state it was handed. The last option fails too: placeCandidate refuses occupied cells, and without the undo the trail would be out of order."}},{id:"constraint-solving",title:"Constraint-based problem solving",summary:"Remove impossible values before searching.",definition:"A constraint satisfaction problem asks for values for a set of variables (here, the 81 cells) that satisfy every constraint. Good solvers combine search with reasoning that rules out impossible values early.",example:"Pencil marks are candidates: the digits a cell's peers have not ruled out. A cell with one candidate is forced, a so-called naked single. Filling forced cells can create new forced cells, so the effect propagates across the board.",demo:"candidates",demoCaption:"All candidates come from board.getCandidates(). Fill the forced cells round by round and watch the board shrink.",code:{file:"board",member:"getCandidates"},implementation:"getCandidates reads the cell's row, column and box once and returns the missing digits. The MRV solver and the Hint button both build on it.",quiz:{question:"A cell's row contains 1, 2 and 3, its column contains 4, 5 and 6, and its box contains 7 and 8. What are its candidates?",options:["[9]","[1, 2, \u2026, 9]","[7, 8, 9]","None"],answer:0,explanation:"Its peers already use 1 to 8, so 9 is the only digit left. The cell is a naked single."}},{id:"complexity",title:"Time and space complexity",summary:"How work grows: O(9\u1D50) time, O(m) stack.",definition:"Time complexity describes how the work grows with the size of the input; space complexity describes how memory grows. Big-O notation gives an upper bound on that growth.",example:"With m empty cells and up to 9 digits for each, plain backtracking can explore at most about 9\u1D50 full assignments, so O(9\u1D50) is a loose upper bound on its running time. The recursion stack holds at most m + 1 frames, so the extra space is O(m), not counting the board itself or a recorded trace.",demo:"complexity",demoCaption:"Compare the theoretical bound with work measured by running both solvers in your browser.",code:{file:"backtracking",member:"solve",step:"try"},implementation:"The highlighted loop is where branching happens: up to 9 options per call, nested m levels deep. The rules prune most branches early, which is why measured work is far below 9\u1D50.",quiz:{question:"Why is O(9\u1D50) only a loose bound for this solver?",options:["Most digits are rejected by the rules long before a full assignment is built","Computers run faster than Big-O predicts","m is never larger than 10","Sudoku can be solved in constant time"],answer:0,explanation:"The bound counts every way to fill m cells with 9 digits. findConflict cuts off a branch as soon as one digit breaks a rule, so almost none of those assignments is ever built."}},{id:"optimization",title:"Algorithm optimization",summary:"MRV: most constrained cell first.",definition:"A heuristic is a rule of thumb that usually makes a search faster without changing what counts as a correct answer. Minimum Remaining Values (MRV) picks the most constrained variable first.",example:"Instead of the first empty cell, MRV picks the empty cell with the fewest candidates. A cell with one candidate needs no branching; a cell with zero proves the branch is dead at once. The price is scoring every empty cell on each call. MRV usually shrinks the search tree a great deal, but the worst case stays exponential.",demo:"mrv",demoCaption:"Which cell would each solver fill first on this board? Computed live with findEmptyCell() and selectMRVCell().",code:{file:"mrv",member:"selectMRVCell"},implementation:"selectMRVCell calls getCandidates for every empty cell, keeps the smallest set, and stops early if it finds a cell with none. Analyze mode measures what this costs and saves.",quiz:{question:"What does the MRV solver do when some empty cell has zero candidates?",options:["Tries the digits 1\u20139 there anyway","Returns false immediately: it fails early","Skips that cell and carries on","Restarts from the original puzzle"],answer:1,explanation:"No later choice can give that cell a digit, so the branch is impossible. Returning false straight away lets the caller try its next option."}}];var bv=E(ae(),1);var Zt=E(D(),1);function xv({code:e}){let t=xl[e.file],a=(0,bv.useRef)(null),l=[],n="",i=t.path;if(e.signatures)n=`class SudokuBoard {
